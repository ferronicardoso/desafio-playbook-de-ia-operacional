description: Nota de triagem - testes determinísticos (CP08)

# Caminhos relativos a esta pasta. Executar a partir dela:
#   promptfoo eval -c promptfooconfig.yaml
prompts:
  - file://prompt.md

providers:
  - id: openai:gpt-6-sol
    label: openai-gpt-6-sol
    config:
      reasoning_effort: low
  - id: anthropic:messages:claude-sonnet-5-5
    label: anthropic-sonnet-5-5
    config:
      max_tokens: 1024
      thinking:
        type: between_tools

defaultTest:
  assert:
    # Cinco rótulos fixos da nota
    - type: contains-all
      value:
        - 'ALERTA:'
        - 'IMPACTO:'
        - 'HIPÓTESE INICIAL:'
        - 'AÇÃO IMEDIATA:'
        - 'ESCALAR PARA:'
    # Linha de escalonamento com handle (@time)
    - type: regex
      value: 'ESCALAR PARA:.*@\w+'
    # No máximo 8 linhas não vazias
    - type: javascript
      value: "output.trim().split('\\n').length <= 8"
    # Orçamento por chamada
    - type: latency
      threshold: 5000
    - type: cost
      threshold: 0.01

tests:
  - description: Alerta 1 - autoscaler no limite com pico de volume de um tenant
    vars:
      alerta_cru: |
        2026-05-12 14:02:09 UTC [Sentinel] autoscaler hit max replicas (60/60) on sentinel-api,
        queue depth on Relay growing 2k/min, CPU avg 88%, tenant stark-industries
        sending 4x baseline volume after onboarding new region

  - description: Alerta 2 - rejeição de ingestão após deploy
    vars:
      alerta_cru: |
        2026-05-13 03:11:00 UTC [Relay] ingest reject rate 6% for 8min, tenant wakanda-systems,
        buffer saturated after deploy 02:55

  - description: Alerta 3 - lag de consumer após falha de job
    vars:
      alerta_cru: |
        2026-05-13 11:40:22 UTC [Forge] consumer lag 9min and climbing, batch forge-batch-ingest
        delayed after previous job failure, downstream Sentinel starting to lag
